name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }   # gem5 + linux are large and not needed for these checks
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Regression tests (stdlib only, no install step)
        run: make test
      - name: Lint (byte-compile python, syntax-check shell)
        run: make lint
